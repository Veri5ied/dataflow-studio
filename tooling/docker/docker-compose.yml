version: "3.9"

services:
  gui:
    build:
      context: ../..
      dockerfile: tooling/docker/Dockerfile.gui
    ports:
      - "3000:3000"
    env_file:
      - ../../.env

  api:
    build:
      context: ../..
      dockerfile: tooling/docker/Dockerfile.api
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
